name: Go CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

# A run is superseded only on a pull request. On main (and on any other push)
# the group is unique per ref and commit, so no run is ever cancelled: the main
# run of ci.yml cuts the version tag (strongo/cicd go_bump) and must complete
# for every merge. The literal `true` below only ever applies to pull_request
# groups, which are keyed by pull request number.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: true

jobs:

  strongo_workflow:
    permissions:
      contents: write
    uses: strongo/cicd/.github/workflows/workflow.yml@v1.20.0

    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    with:
      require_conventional_pr_title: true
      # Auto-tag on main, same as dal-go/dalgo. The earlier reasoning here
      # ("v0.1.0 was hand-tagged so openvaultdb/ovdb could pin an exact
      # version; auto-tagging would surprise that consumer") does not hold:
      # ovdb pins v0.1.0 in its go.mod, and Go modules only move on an
      # explicit bump, so a new tag upstream cannot surprise it. Leaving
      # bumping disabled had a real cost -- the HTTP-500-on-every-write fix
      # in #13 landed on main with no tag, so it could not reach the CLI at
      # all until someone hand-tagged, which is exactly the manual step
      # releases are supposed to have stopped needing.
      disable-version-bumping: false
      # Pure-Go stack (modernc.org/sqlite) — no C toolchain needed.
      cgo_enabled: false
      # Measured total (go test ./... -coverprofile + go tool cover -func) was
      # 59.3% at the time this floor was set; kept a few points below so the
      # gate doesn't fail on day one from measurement noise.
      min_test_coverage_percent: 55
